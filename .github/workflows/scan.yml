name: BioIQ scansione automatica
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Esegui motore BioIQ
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine.py
      - name: Aggiorna dashboard e storico
        run: |
          git config user.name "bioiq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json docs/seen_leads.json
          git commit -m "Scansione BioIQ $(date -I)" || true
          git pull --rebase --autostash origin main
          git push
